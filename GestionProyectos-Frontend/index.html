<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Proyectos</title>
    <!--
      El tema NO se pre-aplica desde localStorage (ya no lo usamos): la
      fuente de verdad son las preferencias del usuario en la BASE DE DATOS.
      El primer paint usa los defaults de index.css (azul #295072) y, apenas
      /auth/me resuelve, el ThemeContext aplica el tema del usuario. El
      ViewSkeleton del AuthContext cubre ese instante de carga.
    -->
    <script>
      // Anti-flash de tema: aplica el modo (claro/oscuro) ANTES del primer
      // paint, leyendo la cookie `gp-mode` que escribe el ThemeContext. La
      // fuente de verdad sigue siendo la BD; esto sólo evita el parpadeo.
      (function () {
        try {
          var m = (document.cookie.match(/(?:^|;\s*)gp-mode=(dark|light)/) || [])[1];
          var el = document.documentElement;
          if (m) el.setAttribute('data-theme', m);
          if (m === 'dark') {
            var d = {
              '--color-bg': '10 18 24',
              '--color-bg-muted': '17 29 40',
              '--color-fg': '244 247 252',
              '--color-fg-muted': '210 218 230',
              '--color-fg-subtle': '160 172 190',
              '--color-fg-faint': '120 135 155',
              '--color-surface-hover': '21 37 51',
              '--color-border': '24 41 56',
              '--color-border-subtle': '15 25 35',
              '--color-page-bg': '6 10 13'
            };
            for (var k in d) el.style.setProperty(k, d[k]);
            el.style.backgroundColor = 'rgb(6 10 13)';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
